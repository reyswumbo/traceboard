name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: traceboard123
      KEY_PASSWORD: traceboard123
      KEY_ALIAS: traceboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore traceboard-keystore.jks \
            -alias traceboard \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD \
            -dname "CN=Traceboard, OU=Dev, O=Traceboard, L=Jakarta, ST=Jakarta, C=ID"

      - name: Build signed release and debug APK
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/traceboard-release.apk 2>/dev/null || true
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/traceboard-release.apk 2>/dev/null || true
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/traceboard-debug.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: traceboard-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: traceboard-debug
          path: app/build/outputs/apk/debug/*.apk